<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230b0d10'/><path d='M 11 11 A 7 7 0 0 0 11 21 M 21 11 A 7 7 0 0 1 21 21 M 7 7 A 12.7 12.7 0 0 0 7 25 M 25 7 A 12.7 12.7 0 0 1 25 25' fill='none' stroke='%23ffb547' stroke-width='2.6' stroke-linecap='round'/><circle cx='16' cy='16' r='3.2' fill='%23ffb547'/></svg>">
<title>Scanner History</title>
<style>
  :root {
    --bg: #0b0d10; --panel: #15181d; --text: #e9edf2; --dim: #8a94a3; --faint: #4a525e; --line: #22262d;
    --enc: #ffb547; --bad: #ff5d5d; --law: #1f5fd6; --fire: #d42a2a; --flight: #1f9e4a;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 16px/1.3 -apple-system, "Segoe UI", Roboto, "DejaVu Sans", sans-serif; padding: 16px; max-width: 900px; margin: 0 auto; }
  header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 1em; margin-bottom: 12px; }
  h1 { font-size: 1.4em; }
  .btn { display: inline-flex; align-items: center; min-height: 44px; padding: 0 1.1em; border-radius: 22px;
         background: var(--panel); color: var(--text); text-decoration: none; border: 1px solid #2a2f37; }
  .btn { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  body.kiosk, body.kiosk * { cursor: none; }  /* no mouse pointer left in the middle of a touchscreen */
  .btn:active { background: #22262d; }
  #status { color: var(--dim); font-size: .9em; }
  #status.bad { color: var(--bad); }
  ol { list-style: none; padding: 0; }
  li { display: grid; grid-template-columns: 4.6em minmax(0, 1fr) auto; gap: .2em 1em; padding: 10px 12px; border-left: 6px solid var(--kind, var(--faint));
       background: var(--panel); border-radius: 6px; margin-bottom: 6px; font-variant-numeric: tabular-nums; }
  li.law { --kind: var(--law); } li.fire { --kind: var(--fire); } li.flight { --kind: var(--flight); }
  li.live { background: color-mix(in srgb, var(--kind, var(--faint)) 35%, var(--panel)); }
  .t { color: var(--dim); }
  .ch { font-weight: 700; overflow-wrap: anywhere; }
  .right { text-align: right; color: var(--dim); white-space: nowrap; }
  .sub { grid-column: 2 / 4; overflow-wrap: anywhere; color: var(--dim); font-size: .88em; }
  .enc { color: var(--enc); font-weight: 600; }
  .day { color: var(--dim); font-size: .85em; margin: 14px 0 6px; text-transform: uppercase; letter-spacing: .06em; }
  .empty { color: var(--dim); padding: 2em 0; text-align: center; }
</style>
</head>
<body>
<header><h1>Scanner history</h1><span id="status"></span><a class="btn" href="./">Live view</a></header>
<div id="list"></div>
<script>
  const $ = id => document.getElementById(id);
  const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const time = t => new Date(t * 1000).toLocaleTimeString([], { hour12: false });
  const day = t => new Date(t * 1000).toLocaleDateString([], { weekday: "long", month: "short", day: "numeric" });
  const dur = e => { const s = Math.max(1, Math.round(e.last - e.start + 0.5)); return s < 60 ? s + " s" : Math.floor(s / 60) + " min " + (s % 60) + " s"; };
  let lastOk = 0;

  async function tick() {
    try {
      const s = await (await fetch("state.json", { cache: "no-store" })).json();
      lastOk = Date.now();
      $("status").className = s.connected ? "" : "bad";
      $("status").textContent = s.connected ? s.log.length + " calls" : "scanner not connected";
      let html = "", lastDay = null;
      s.log.forEach((e, i) => {
        const d = day(e.start);
        if (d !== lastDay) { html += (lastDay ? "</ol>" : "") + `<div class="day">${esc(d)}</div><ol>`; lastDay = d; }
        const live = i === 0 && s.now;
        html += `<li class="${e.kind || ""} ${live ? "live" : ""}">` +
          `<span class="t">${time(e.start)}</span><span class="ch">${esc(e.channel || e.freq)}</span>` +
          `<span class="right">${live ? "now" : dur(e)}${e.encrypted ? ' · <span class="enc">encrypted</span>' : ""}</span>` +
          `<span class="sub">${esc([e.department, e.system, e.freq, e.service].filter(Boolean).filter((v, j, a) => a.indexOf(v) === j).join(" · "))}</span></li>`;
      });
      if (lastDay) html += "</ol>";
      $("list").innerHTML = html || '<p class="empty">Nothing heard since the display started.</p>';
    } catch (e) {}
    if (Date.now() - lastOk > 5000) { $("status").className = "bad"; $("status").textContent = "can't reach the display server"; }
  }
  setInterval(tick, 2000); tick();
  // On the Pi's own screen a tap wakes the backlight (see display.py).
  if (document.body.classList.contains("kiosk"))
    addEventListener("pointerdown", () => fetch("wake", { method: "POST" }).catch(() => {}), { capture: true });
</script>
</body>
</html>
